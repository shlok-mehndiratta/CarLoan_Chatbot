[pytest]
testpaths = backend/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -p no:launch_ros
    -p no:launch_testing
    -p no:ament_lint
    -p no:ament_pep257
    -p no:ament_flake8
    -p no:ament_xmllint
    -p no:ament_copyright
    -p no:langsmith_plugin
